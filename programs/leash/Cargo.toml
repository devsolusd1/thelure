[package]
name = "lure-leash"
version = "0.1.0"
edition = "2021"
description = "On-chain leash for token agents: a bounded budget and bounded knobs."
license = "MIT"
publish = false

[lib]
name = "lure_leash"
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.11", default-features = false, features = ["cpi"] }
pinocchio-system = "0.6"

# Deploy rent is paid per byte, so the release build optimises for size.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
